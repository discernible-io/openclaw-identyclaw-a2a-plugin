name: E2E (pull request, manual approval)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E against openclaw@latest
    runs-on: ubuntu-latest
    # Gates the job on a required reviewer for the `e2e-manual` environment.
    # The environment must be created in repo Settings → Environments with
    # at least one required reviewer; otherwise this job runs without a gate.
    environment: e2e-manual
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run e2e tests
        env:
          RUN_E2E: "1"
        run: bun test tests/e2e
